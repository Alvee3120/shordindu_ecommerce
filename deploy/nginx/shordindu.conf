# Shordindu — single-origin nginx front door.
# Routes the Next.js app and the Django API on the same host:port so the browser
# never makes a cross-origin request (no CORS, no SameSite/cookie surprises).

server {
    listen 80 default_server;
    server_name 13.236.66.156 _;

    # Product images and banner uploads go through this box.
    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # consumed by SECURE_PROXY_SSL_HEADER
    proxy_read_timeout 65s;

    # ---- Django API (gunicorn) ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # collectstatic output of the live release.
    location /static/ {
        alias /var/www/shordindu/current/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # User uploads live in shared/ so a deploy can never delete them.
    location /media/ {
        alias /var/www/shordindu/shared/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Next.js (node server.js) ----
    # Hashed assets never change, so they can be cached forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
